<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="HandheldFriendly" content="true">
  <meta name="MobileOptimized" content="width">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <title>Clock</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #f2f2f2;
      overflow: hidden;
    }

    body {
      display: table;
      font-family: "Droid Sans", "Roboto", "Helvetica Neue", Arial, sans-serif;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    .stage {
      display: table-cell;
      width: 100%;
      height: 100%;
      vertical-align: middle;
      text-align: center;
      padding: 4% 3%;
    }

    .time {
      margin: 0;
      font-weight: normal;
      font-size: 26vw;
      line-height: 1;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .ampm {
      display: inline-block;
      margin-left: 0.12em;
      font-size: 0.22em;
      letter-spacing: 0.12em;
      color: #c8c8c8;
      vertical-align: 1.35em;
    }

    .date {
      margin: 3.2vh 0 0;
      font-size: 4.2vw;
      line-height: 1.2;
      color: #a3a3a3;
    }

    .tz {
      margin: 1vh 0 0;
      font-size: 3.2vw;
      line-height: 1.3;
      color: #7a7a7a;
    }

    .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      margin: 0;
      font-size: 12px;
      color: #555555;
      text-align: center;
    }

    .hint.hidden {
      display: none;
    }

    @media screen and (orientation: landscape) {
      .time {
        font-size: 32vh;
      }

      .date {
        margin-top: 2vh;
        font-size: 4.6vh;
      }

      .tz {
        font-size: 3.4vh;
      }
    }

    @media screen and (orientation: landscape) and (max-height: 420px) {
      .time {
        font-size: 28vh;
      }

      .date {
        margin-top: 6vh;
        font-size: 4.2vh;
      }

      .tz {
        margin-top: 1vh;
        font-size: 3.2vh;
      }

      .hint {
        display: none;
      }
    }

    @media screen and (orientation: portrait) and (min-width: 700px) {
      .time {
        font-size: 18vw;
      }

      .date {
        font-size: 3vw;
      }

      .tz {
        font-size: 2.4vw;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <h1 class="time"><span id="time">--:--</span><span id="ampm" class="ampm"></span></h1>
    <p id="date" class="date"></p>
    <p id="tz" class="tz"></p>
  </div>
  <p id="hint" class="hint">Tap for fullscreen</p>
  <script>
    (function () {
      var timeEl = document.getElementById("time");
      var ampmEl = document.getElementById("ampm");
      var dateEl = document.getElementById("date");
      var tzEl = document.getElementById("tz");
      var hintEl = document.getElementById("hint");
      var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      function pad(n) {
        return (n < 10 ? "0" : "") + n;
      }

      function setText(el, value) {
        if (el.firstChild) {
          el.firstChild.nodeValue = value;
        } else {
          el.appendChild(document.createTextNode(value));
        }
      }

      function timezoneLabel(date) {
        var name = "";
        try {
          if (window.Intl && Intl.DateTimeFormat) {
            var options = Intl.DateTimeFormat().resolvedOptions();
            if (options && options.timeZone) {
              name = String(options.timeZone).replace(/_/g, " ");
            }
          }
        } catch (err) {}

        var offset = -date.getTimezoneOffset();
        var sign = offset >= 0 ? "+" : "-";
        var abs = Math.abs(offset);
        var gmt = "GMT" + sign + pad(Math.floor(abs / 60)) + ":" + pad(abs % 60);
        return name ? name + "  ·  " + gmt : gmt;
      }

      function render() {
        var now = new Date();
        var hours = now.getHours();
        var ampm = hours >= 12 ? "PM" : "AM";
        var hour12 = hours % 12;
        if (hour12 === 0) {
          hour12 = 12;
        }

        setText(timeEl, pad(hour12) + ":" + pad(now.getMinutes()));
        setText(ampmEl, ampm);
        setText(dateEl, days[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear());
        setText(tzEl, timezoneLabel(now));
      }

      function hideHint() {
        if (hintEl) {
          hintEl.className = "hint hidden";
        }
      }

      function enterFullscreen() {
        var root = document.documentElement;
        var request = root.requestFullscreen ||
          root.webkitRequestFullscreen ||
          root.webkitRequestFullScreen ||
          root.mozRequestFullScreen ||
          root.msRequestFullscreen;

        if (request) {
          try {
            request.call(root);
          } catch (err) {}
        }

        try {
          if (screen.orientation && screen.orientation.lock) {
            var locked = screen.orientation.lock("landscape");
            if (locked && locked["catch"]) {
              locked["catch"](function () {});
            }
          }
        } catch (err2) {}

        hideHint();
      }

      render();
      setInterval(render, 1000);

      document.onclick = enterFullscreen;

      window.onorientationchange = function () {
        window.scrollTo(0, 1);
      };
      window.scrollTo(0, 1);
    })();
  </script>
</body>
</html>
